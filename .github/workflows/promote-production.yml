
name: CD - Promote Staging to Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character SHA verified on Staging"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: aureliabooks-production-deploy
  cancel-in-progress: false

jobs:
  preflight:
    name: Verify Staging Release Candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10

    outputs:
      sha: ${{ steps.verify.outputs.sha }}

    steps:
      - name: Checkout trusted workflow sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false
      - name: Set up Java gate runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify SHA and Staging deployment
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          bash scripts/java-tools.sh WorkflowGate promotion

          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" \
            > ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_SSH_HOST_KEY" \
            > ~/.ssh/known_hosts

          ssh-keygen -y \
            -f ~/.ssh/id_ed25519 > /dev/null

      - name: Verify running Staging image and HTTP
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ steps.verify.outputs.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail

          EXPECTED="ghcr.io/dungtlab/aureliabooks_ddagtech:sha-$1"

          ACTUAL="$(docker inspect \
            aurelia-staging-app-1 \
            --format '{{.Config.Image}}')"

          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "ERROR: Staging image mismatch"
            exit 1
          }

          curl -fsS \
            -o /dev/null \
            --max-time 20 \
            http://127.0.0.1:18080/

          echo "Staging preflight: PASS"
          REMOTE

  production:
    name: Approve and Deploy Production
    needs: preflight
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail

          umask 077
          mkdir -p ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" \
            > ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_SSH_HOST_KEY" \
            > ~/.ssh/known_hosts

          ssh-keygen -y \
            -f ~/.ssh/id_ed25519 > /dev/null

      - name: Revalidate release candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail

          LATEST_SHA="$(gh api \
            "repos/$REPOSITORY/branches/main" \
            --jq '.commit.sha')"

          [[ "$LATEST_SHA" == "$DEPLOY_SHA" ]] || {
            echo "ERROR: main changed while awaiting approval"
            exit 1
          }

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail

          EXPECTED="ghcr.io/dungtlab/aureliabooks_ddagtech:sha-$1"

          ACTUAL="$(docker inspect \
            aurelia-staging-app-1 \
            --format '{{.Config.Image}}')"

          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "ERROR: Staging image changed"
            exit 1
          }

          curl -fsS \
            -o /dev/null \
            --max-time 20 \
            http://127.0.0.1:18080/

          echo "Production release preflight: PASS"
          REMOTE

      - name: Deploy Production
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "/opt/apps/swp391/scripts/deploy.sh $DEPLOY_SHA"

      - name: Verify Production
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "bash -s -- '$DEPLOY_SHA'" <<'REMOTE'
          set -euo pipefail

          EXPECTED="ghcr.io/dungtlab/aureliabooks_ddagtech:sha-$1"

          ACTUAL="$(docker inspect \
            aurelia-production-app-1 \
            --format '{{.Config.Image}}')"

          [[ "$ACTUAL" == "$EXPECTED" ]] || {
            echo "ERROR: Production image mismatch"
            exit 1
          }

          curl -fsS \
            -o /dev/null \
            --max-time 20 \
            http://127.0.0.1:8080/

          echo "Production image and HTTP: PASS"
          REMOTE
