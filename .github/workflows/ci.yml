name: CI - AureliaBooks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  maven-verify:
    name: Maven Verify - Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Maven Wrapper permissions
        run: test -x ./mvnw

      - name: Build and run tests
        run: ./mvnw -B -ntp verify

  catalog-seed-validation:
    name: Catalog Seed - Static Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Catalog SQL templates
        run: |
          bash scripts/java-tools.sh CatalogSeed --policy

      - name: Verify Seed Runner dry-run
        shell: bash
        run: |
          set -euo pipefail

          ledger="$(mktemp)"
          trap 'rm -f "$ledger"' EXIT

          printf '%s\n' \
            '{"version":1,"environment":"staging","entries":[]}' \
            > "$ledger"

          bash scripts/java-tools.sh CatalogSeed \
            --dry-run \
            --environment staging \
            --ledger "$ledger"
