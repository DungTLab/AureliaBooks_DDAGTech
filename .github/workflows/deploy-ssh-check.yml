
name: CD - Verify Production SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-ssh:
    name: Verify Oracle VPS SSH
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5

    steps:
      - name: Configure SSH credentials
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 > /dev/null

      - name: Verify VPS connection
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            'echo "CD SSH: OK"; whoami; hostname; docker info --format "Docker: OK"'
