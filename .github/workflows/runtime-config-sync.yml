name: Runtime Configuration - Validate, Stage or Activate

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Validate, stage only, or explicitly activate Google/Mail/VNPay with rollback'
        type: choice
        options: [validate, stage, activate-google]
        default: validate
        required: true
      target_environment:
        description: 'GitHub Environment supplying the snapshot and SSH credentials'
        type: choice
        options: [staging, production]
        default: staging
        required: true

permissions:
  contents: read

concurrency:
  group: aureliabooks-runtime-config-offline
  cancel-in-progress: false

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require main branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$SOURCE_REF" = 'refs/heads/main'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate Java configuration contracts and Spring Boot property loading
        run: ./mvnw -B -ntp -Djava.awt.headless=true '-Dtest=RuntimeConfig*Test,RuntimeConfigurationContractTest' test
      - name: Package standalone JDK-only configuration tool
        run: jar --create --file target/runtime-config-tool.jar --main-class com.ddagtech.aureliabooks.runtimeconfig.RuntimeConfigCli -C target/classes com/ddagtech/aureliabooks/runtimeconfig
      - name: Report real integration status
        run: echo 'Validation complete. Transfer/activation requires provisioned receiver and environment approval.'

  stage-snapshot:
    if: ${{ github.ref == 'refs/heads/main' && (inputs.operation == 'stage' || inputs.operation == 'activate-google') }}
    needs: offline-validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.target_environment }}
    concurrency:
      # The VPS wrapper serializes activation with image deploy using flock.
      # Separate GitHub group avoids replacing pending image deployment jobs.
      group: aureliabooks-runtime-stage-${{ inputs.target_environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify approved revision is still main HEAD
        env:
          GH_TOKEN: ${{ github.token }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$REVISION"
      - name: Build sender without starting the application
        run: |
          mkdir -p target/runtime-config-standalone
          javac --release 21 -d target/runtime-config-standalone src/main/java/com/ddagtech/aureliabooks/runtimeconfig/*.java
          jar --create --file target/runtime-config-tool.jar --main-class com.ddagtech.aureliabooks.runtimeconfig.RuntimeConfigCli -C target/runtime-config-standalone .
      - name: Transfer snapshot and perform selected activation
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          CONFIG_OPERATION: ${{ inputs.operation }}
          REVISION: ${{ github.sha }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          VNPAY_TMN_CODE: ${{ secrets.VNPAY_TMN_CODE }}
          VNPAY_HASH_SECRET: ${{ secrets.VNPAY_HASH_SECRET }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_AUTH: ${{ vars.MAIL_AUTH }}
          MAIL_STARTTLS: ${{ vars.MAIL_STARTTLS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          DEMO_SMS_INBOX: ${{ vars.DEMO_SMS_INBOX }}
          VNPAY_PAY_URL: ${{ vars.VNPAY_PAY_URL }}
          VNPAY_API_URL: ${{ vars.VNPAY_API_URL }}
          VNPAY_RETURN_URL: ${{ vars.VNPAY_RETURN_URL }}
          VNPAY_VERSION: ${{ vars.VNPAY_VERSION }}
          VNPAY_COMMAND: ${{ vars.VNPAY_COMMAND }}
          VNPAY_ORDER_TYPE: ${{ vars.VNPAY_ORDER_TYPE }}
          VNPAY_EXPIRE_MINUTES: ${{ vars.VNPAY_EXPIRE_MINUTES }}
          R2_ENABLED: ${{ vars.R2_ENABLED || 'false' }}
          R2_UPLOAD_ENABLED: ${{ vars.R2_UPLOAD_ENABLED || 'false' }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
          R2_UPLOAD_REQUESTS_PER_MINUTE: ${{ vars.R2_UPLOAD_REQUESTS_PER_MINUTE }}
          R2_UPLOAD_MAX_CONCURRENT: ${{ vars.R2_UPLOAD_MAX_CONCURRENT }}
          R2_ACCESS_KEY_ID: ${{ vars.R2_ENABLED == 'true' && secrets.R2_ACCESS_KEY_ID || '' }}
          R2_SECRET_ACCESS_KEY: ${{ vars.R2_ENABLED == 'true' && secrets.R2_SECRET_ACCESS_KEY || '' }}
        run: bash scripts/runtime-config/stage.sh "$TARGET_ENVIRONMENT" "$REVISION" "$CONFIG_OPERATION"
