
name: CD - Deploy Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full 40-character SHA of the GHCR image"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aureliabooks-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10

    steps:
      - name: Validate commit SHA
        env:
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1

      - name: Configure SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_HOST_KEY: ${{ secrets.VPS_SSH_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy application
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail

          ssh \
            -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$VPS_USER@$VPS_HOST" \
            "/opt/apps/swp391/scripts/deploy.sh $DEPLOY_SHA"
