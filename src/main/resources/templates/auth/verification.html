<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" th:replace="~{layout/base :: layout('Xác thực tài khoản', ~{::#main-content})}"><head><title>Xác thực tài khoản</title></head><body>
<section id="main-content" class="max-w-lg mx-auto px-4 py-10"><div class="bg-white border border-dust_grey rounded-2xl p-6 space-y-5">
<h1 class="font-serif text-2xl font-bold" th:text="${verification.kind == 'REGISTER' ? 'Xác minh SĐT đăng ký' : 'Khôi phục mật khẩu'}"></h1>
<p th:if="${verificationMessage != null}" th:text="${verificationMessage}" role="status" class="bg-parchment rounded-xl p-3"></p>
<div th:unless="${verification.authorized}"><p>Nhập mã 6 chữ số gửi tới <span th:text="${verification.recipient}"></span>. Mã có hiệu lực 5 phút.</p>
<form th:action="@{/auth/verification/verify}" method="post" class="space-y-3 mt-3"><label for="accountCode" class="block font-semibold">Mã xác thực</label><input id="accountCode" name="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required class="w-full border border-dust_grey rounded-xl p-3"><button class="bg-blazing_flame text-white px-5 py-3 rounded-xl">Xác nhận</button></form>
<form th:action="@{/auth/verification/resend}" method="post" class="mt-3"><button th:disabled="${verification.resendIn > 0}" class="border border-dust_grey rounded-xl px-4 py-2 disabled:opacity-50">Gửi lại mã</button><p th:if="${verification.resendIn > 0}" class="text-sm">Chờ <span th:text="${verification.resendIn}"></span> giây; tải lại trang để cập nhật.</p></form></div>
<form th:if="${verification.authorized}" th:action="@{/auth/verification/reset}" method="post" class="space-y-4">
<p>Từ 8 ký tự, có chữ hoa, số và ký tự đặc biệt.</p>
<div><label for="resetPassword" class="block font-semibold">Mật khẩu mới</label><div class="relative" data-password-field><input id="resetPassword" name="password" type="password" required minlength="8" autocomplete="new-password" class="w-full border border-dust_grey rounded-xl p-3 pr-14"><button type="button" data-password-toggle aria-controls="resetPassword" aria-label="Hiện mật khẩu mới" aria-pressed="false" class="absolute right-2 top-1/2 -translate-y-1/2 p-2"><i class="bi bi-eye" aria-hidden="true"></i></button></div></div>
<div><label for="resetConfirm" class="block font-semibold">Xác nhận mật khẩu</label><div class="relative" data-password-field><input id="resetConfirm" name="confirmation" type="password" required autocomplete="new-password" class="w-full border border-dust_grey rounded-xl p-3 pr-14"><button type="button" data-password-toggle aria-controls="resetConfirm" aria-label="Hiện mật khẩu xác nhận" aria-pressed="false" class="absolute right-2 top-1/2 -translate-y-1/2 p-2"><i class="bi bi-eye" aria-hidden="true"></i></button></div></div>
<button class="bg-blazing_flame text-white px-5 py-3 rounded-xl">Đặt mật khẩu mới</button></form>
<a th:href="@{/auth/login}" class="text-sm underline">Quay về đăng nhập</a>
</div></section></body></html>
