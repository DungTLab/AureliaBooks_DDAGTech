<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Đăng ký tài khoản', ~{::#main-content})}">
<head><title>Đăng ký tài khoản</title></head>
<body>
<section id="main-content" class="max-w-2xl mx-auto px-4 sm:px-6 py-10 sm:py-16">
    <div class="bg-white rounded-2xl border border-dust_grey shadow-soft p-6 sm:p-10">
        <div class="text-center mb-7">
            <span class="text-blazing_flame text-3xl" aria-hidden="true"><i class="bi bi-book"></i></span>
            <h1 class="font-serif text-3xl text-carbon_black font-bold mt-3">Tạo tài khoản</h1>
            <p class="text-carbon_black-500 mt-2">Chào mừng bạn đến với AureliaBook</p>
        </div>
        <a th:if="${googleEnabled}" th:href="@{/auth/google/register}"
           class="flex items-center justify-center gap-3 bg-white text-[#1f1f1f] border border-[#747775] rounded-xl px-4 py-3 font-medium transition-colors hover:bg-[#f2f2f2] focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blazing_flame focus-visible:ring-offset-2">
            <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path fill="#4285F4" d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-2 3.02v2.51h3.24c1.9-1.75 2.98-4.33 2.98-7.36Z"/>
                <path fill="#34A853" d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.24-2.51c-.9.6-2.04.96-3.38.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.59A10 10 0 0 0 12 22Z"/>
                <path fill="#FBBC05" d="M6.41 13.92A6 6 0 0 1 6.1 12c0-.67.11-1.32.31-1.92V7.49H3.07A10 10 0 0 0 2 12c0 1.61.38 3.14 1.07 4.51l3.34-2.59Z"/>
                <path fill="#EA4335" d="M12 5.96c1.47 0 2.79.5 3.82 1.49l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.93 5.49l3.34 2.59C7.2 7.72 9.4 5.96 12 5.96Z"/>
            </svg>
            <span>Tiếp tục với Google</span>
        </a>
        <button th:unless="${googleEnabled}" type="button" disabled
                class="w-full border border-dust_grey rounded-xl px-4 py-3 text-carbon_black-500 opacity-60">Tiếp tục với Google (chưa khả dụng)</button>
        <div class="flex items-center gap-4 text-sm text-carbon_black-500 my-6"><hr class="flex-1 border-dust_grey">hoặc đăng ký bằng email<hr class="flex-1 border-dust_grey"></div>
        <form th:action="@{/auth/register}" method="post" th:object="${registerRequest}" class="space-y-5">
            <div th:if="${#fields.hasErrors('*')}" role="alert" class="bg-red-50 text-red-800 border border-red-200 rounded-xl p-4">
                <p class="font-semibold">Vui lòng kiểm tra lại thông tin:</p>
                <ul class="list-disc pl-5 mt-2"><li th:each="message : ${#fields.errors('*')}" th:text="${message}"></li></ul>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="fullName" class="block font-semibold text-sm mb-2">Họ và tên <span class="text-blazing_flame" aria-hidden="true">*</span></label>
                    <input id="fullName" th:field="*{fullName}" type="text" autocomplete="name" required minlength="2" maxlength="100"
                           th:attr="aria-invalid=${#fields.hasErrors('fullName')}"
                           th:classappend="${#fields.hasErrors('fullName')} ? 'border-red-600'"
                           class="w-full min-w-0 border border-dust_grey rounded-xl px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blazing_flame">
                </div>
                <div>
                    <label for="email" class="block font-semibold text-sm mb-2">Email <span class="text-blazing_flame" aria-hidden="true">*</span></label>
                    <input id="email" th:field="*{email}" type="email" autocomplete="email" required maxlength="100"
                           th:attr="aria-invalid=${#fields.hasErrors('email')}"
                           th:classappend="${#fields.hasErrors('email')} ? 'border-red-600'"
                           class="w-full min-w-0 border border-dust_grey rounded-xl px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blazing_flame">
                </div>
                <div>
                    <label for="phone" class="block font-semibold text-sm mb-2">Số điện thoại <span class="text-blazing_flame" aria-hidden="true">*</span></label>
                    <input id="phone" th:field="*{phone}" type="tel" autocomplete="tel" required inputmode="numeric" pattern="0[0-9]{9}" maxlength="10"
                           th:attr="aria-invalid=${#fields.hasErrors('phone')}"
                           th:classappend="${#fields.hasErrors('phone')} ? 'border-red-600'"
                           class="w-full min-w-0 border border-dust_grey rounded-xl px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blazing_flame">
                </div>
                <div>
                    <label for="dob" class="block font-semibold text-sm mb-2">Ngày sinh (không bắt buộc)</label>
                    <input id="dob" th:field="*{dob}" type="date" autocomplete="bday" th:max="${#temporals.format(#temporals.createToday().minusDays(1), 'yyyy-MM-dd')}"
                           th:attr="aria-invalid=${#fields.hasErrors('dob')}"
                           th:classappend="${#fields.hasErrors('dob')} ? 'border-red-600'"
                           class="w-full min-w-0 border border-dust_grey rounded-xl px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blazing_flame">
                </div>
                <div>
                    <label for="password" class="block font-semibold text-sm mb-2">Mật khẩu <span class="text-blazing_flame" aria-hidden="true">*</span></label>
                    <input name="password" id="password" type="password" autocomplete="new-password" required minlength="8" aria-describedby="password-help"
                           th:attr="aria-invalid=${#fields.hasErrors('password')}"
                           th:classappend="${#fields.hasErrors('password')} ? 'border-red-600'"
                           class="w-full min-w-0 border border-dust_grey rounded-xl px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blazing_flame">
                </div>
                <div>
                    <label for="confirmPassword" class="block font-semibold text-sm mb-2">Xác nhận mật khẩu <span class="text-blazing_flame" aria-hidden="true">*</span></label>
                    <input name="confirmPassword" id="confirmPassword" type="password" autocomplete="new-password" required
                           th:attr="aria-invalid=${#fields.hasErrors('confirmPassword')}"
                           th:classappend="${#fields.hasErrors('confirmPassword')} ? 'border-red-600'"
                           class="w-full min-w-0 border border-dust_grey rounded-xl px-3 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-blazing_flame">
                </div>
            </div>
            <p id="password-help" class="text-sm text-carbon_black-500">Mật khẩu từ 8 ký tự, có chữ hoa, số và ký tự đặc biệt. Ngày sinh không dùng để xét tuổi.</p>
            <fieldset>
                <legend class="font-semibold text-sm mb-2">Giới tính (không bắt buộc)</legend>
                <div class="flex flex-wrap gap-5 text-sm">
                    <label><input type="radio" th:field="*{gender}" value="MALE" class="accent-blazing_flame"> Nam</label>
                    <label><input type="radio" th:field="*{gender}" value="FEMALE" class="accent-blazing_flame"> Nữ</label>
                    <label><input type="radio" th:field="*{gender}" value="OTHER" class="accent-blazing_flame"> Khác / Không cung cấp</label>
                </div>
            </fieldset>
            <label class="flex items-start gap-3 text-sm leading-relaxed">
                <input type="checkbox" th:field="*{agreeTerms}" required class="mt-1 accent-blazing_flame">
                <span>Tôi đồng ý với điều khoản sử dụng của AureliaBook.</span>
            </label>
            <button type="submit" class="w-full bg-blazing_flame hover:bg-blazing_flame-600 text-white font-bold py-3 rounded-xl transition-colors">Đăng ký</button>
        </form>
        <p class="text-center text-sm mt-6 text-carbon_black-500">Đã có tài khoản? <a th:href="@{/auth/login}" class="text-blazing_flame font-bold hover:underline">Đăng nhập</a></p>
    </div>
</section>
</body>
</html>
