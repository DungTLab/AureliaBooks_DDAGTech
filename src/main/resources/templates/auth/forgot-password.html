<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: layout('Quên mật khẩu', ~{::#main-content})}">
<head><title>Quên mật khẩu</title></head>
<body>
<section id="main-content" class="max-w-lg mx-auto px-4 py-10">
    <div class="bg-white border border-dust_grey rounded-2xl p-6 space-y-5">
        <h1 class="font-serif text-2xl font-bold">Quên mật khẩu</h1>
        <p class="text-sm">Nhập email hoặc số điện thoại đã đăng ký. Chỉ kênh đã xác minh mới nhận được mã khôi
            phục.</p>
        <form th:action="@{/auth/forgot-password/lookup}" method="post" class="space-y-3"><label
                for="recoveryIdentifier" class="block font-semibold">Email hoặc số điện thoại</label><input
                id="recoveryIdentifier" name="identifier" type="text" required maxlength="100" autocomplete="username"
                th:value="${identifier}" th:attr="aria-invalid=${recoveryError != null}" aria-describedby="recoveryError"
                class="w-full border border-dust_grey rounded-xl p-3">
            <p id="recoveryError" th:text="${recoveryError}" role="alert" class="text-sm text-red-700"></p>
            <button class="bg-blazing_flame text-white px-5 py-3 rounded-xl">Tiếp tục</button>
        </form>
        <form th:if="${channels != null}" th:action="@{/auth/forgot-password/send}" method="post" class="space-y-3">
            <div th:if="${channels.size() > 1}"><label for="recoveryChannel" class="block font-semibold">Nhận mã
                qua</label><select id="recoveryChannel" name="channel"
                                   class="w-full border border-dust_grey rounded-xl p-3">
                <option th:each="c : ${channels}" th:value="${c}"
                        th:text="${c == 'EMAIL' ? 'Email đã xác minh' : 'SĐT đã xác minh (SMS)'}"></option>
            </select></div>
            <div th:if="${channels.size() == 1}"><input type="hidden" name="channel" th:value="${channels[0]}">
                <p th:text="${channels[0] == 'EMAIL' ? 'Mã sẽ gửi qua email đã xác minh.' : 'Mã sẽ gửi qua SMS đã xác minh.'}"></p>
            </div>
            <button class="bg-blazing_flame text-white px-5 py-3 rounded-xl">Gửi mã khôi phục</button>
        </form>
        <p class="text-sm">Nếu tài khoản chỉ đăng nhập Google, hãy khôi phục quyền truy cập tại Google.</p><a
            th:href="@{/auth/login}" class="text-sm underline">Quay về đăng nhập</a>
    </div>
</section>
</body>
</html>
