<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <body>
        <section th:fragment="voucher" class="mt-5 space-y-4" aria-labelledby="voucher-heading">
            <h3 id="voucher-heading" class="font-semibold">Mã giảm giá</h3>
            <div th:each="kind : ${ {'product', 'shipping'} }" class="space-y-2">
                <form th:id="${kind + 'VoucherPreview'}" th:action="@{/checkout}" method="get"
                      data-voucher-preview data-form-validation data-required-values="shippingAddressId"
                      th:data-server-blocked="${checkout.selectedAddressId == null}" class="space-y-2">
                    <input type="hidden" name="shippingAddressId" th:value="${checkout.selectedAddressId}" />
                    <input type="hidden" name="paymentMethod" th:value="${selectedPaymentMethod}" />
                    <input th:if="${kind == 'product'}" type="hidden" name="shippingVoucherCode" th:value="${appliedShippingVoucherCode}" />
                    <input th:if="${kind == 'shipping'}" type="hidden" name="voucherCode" th:value="${appliedVoucherCode}" />
                    <label th:for="${kind + 'VoucherCode'}" class="block text-sm font-semibold"
                           th:text="${kind == 'product' ? 'Mã giảm tiền hàng' : 'Mã giảm phí vận chuyển'}"></label>
                    <input th:id="${kind + 'VoucherCode'}" th:name="${kind == 'product' ? 'voucherCode' : 'shippingVoucherCode'}"
                           required pattern="[A-Za-z0-9]{1,30}" maxlength="30" autocomplete="off" data-voucher-code data-silent-empty
                           th:aria-describedby="${kind + 'VoucherError'}"
                           th:value="${kind == 'product' ? voucherCode : shippingVoucherCode}"
                           class="w-full min-w-0 rounded-xl border border-dust_grey px-3 py-2 uppercase" />
                    <button type="submit" class="checkout-button is-secondary" th:disabled="${checkout.selectedAddressId == null}">Áp dụng</button>
                </form>
                <p th:id="${kind + 'VoucherError'}" class="text-sm text-red-700" role="alert"
                   th:text="${kind == 'product' ? productVoucherError : shippingVoucherError}"></p>
                <p class="text-sm text-green-800" role="status"
                   th:with="code=${kind == 'product' ? appliedVoucherCode : appliedShippingVoucherCode}"
                   th:if="${kind == 'product' ? (appliedVoucherCode != null and !appliedVoucherCode.isEmpty()) : (appliedShippingVoucherCode != null and !appliedShippingVoucherCode.isEmpty())}" th:text="${'Đã áp dụng ' + code}"></p>
                <a th:if="${kind == 'product' and appliedVoucherCode != null and !appliedVoucherCode.isEmpty()}"
                   th:href="@{/checkout(shippingAddressId=${checkout.selectedAddressId},paymentMethod=${selectedPaymentMethod},shippingVoucherCode=${appliedShippingVoucherCode})}"
                   class="checkout-text-link">Bỏ mã giảm tiền hàng</a>
                <a th:if="${kind == 'shipping' and appliedShippingVoucherCode != null and !appliedShippingVoucherCode.isEmpty()}"
                   th:href="@{/checkout(shippingAddressId=${checkout.selectedAddressId},paymentMethod=${selectedPaymentMethod},voucherCode=${appliedVoucherCode})}"
                   class="checkout-text-link">Bỏ mã giảm phí vận chuyển</a>
            </div>
            <p class="checkout-help">Mỗi đơn dùng tối đa một mã giảm tiền hàng và một mã giảm phí vận chuyển. Lượt sử dụng chỉ được ghi nhận khi đặt hàng thành công.</p>
            <script th:src="@{/js/checkout-voucher.js}" defer></script>
        </section>
    </body>
</html>
