<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title != null ? title + ' - AureliaBook' : 'AureliaBook - Nhà Sách Trực Tuyến'}">AureliaBook</title>
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-navy: #1F4E78;
            --accent-gold: #D4AF37;
        }
        .bg-navy { background-color: var(--primary-navy) !important; }
        .text-navy { color: var(--primary-navy) !important; }
        .btn-navy {
            background-color: var(--primary-navy);
            color: #ffffff;
            border: none;
        }
        .btn-navy:hover {
            background-color: #163856;
            color: #ffffff;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
</body>
</html>
