<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-navy sticky-top shadow-sm">
    <div class="container">
        <!-- Logo Brand -->
        <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
            <i class="bi bi-book-half me-2 fs-4 text-warning"></i>
            <span>AureliaBook</span>
        </a>

        <!-- Mobile Toggler -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar" aria-controls="mainNavbar" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNavbar">
            <!-- Search Bar (UC02 - Search Products) -->
            <form class="d-flex mx-auto my-2 my-lg-0 col-12 col-lg-5" th:action="@{/products/search}" method="get">
                <div class="input-group">
                    <input class="form-control" type="search" name="keyword" th:value="${param.keyword}" placeholder="Tìm sách, tác giả, ISBN, VPP..." aria-label="Search" required>
                    <button class="btn btn-warning" type="submit">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </form>

            <!-- Navigation Links & User Menu -->
            <ul class="navbar-nav ms-auto align-items-center">
                <!-- Catalog Dropdown (UC01) -->
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/products}">
                        <i class="bi bi-grid me-1"></i> Danh Mục
                    </a>
                </li>

                <!-- Cart Icon (UC10) -->
                <li class="nav-item me-2">
                    <a class="nav-link position-relative text-white" th:href="@{/cart}">
                        <i class="bi bi-cart3 fs-5"></i>
                        <span class="position-absolute top-1 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge" th:text="${cartItemCount != null ? cartItemCount : 0}">
                            0
                        </span>
                    </a>
                </li>

                <!-- Unauthenticated Menu (Guest) -->
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm me-2" th:href="@{/auth/login}">Đăng Nhập</a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn btn-warning btn-sm" th:href="@{/auth/register}">Đăng Ký</a>
                </li>

                <!-- Authenticated User Dropdown -->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle text-white d-flex align-items-center" href="#" id="userMenu" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-5 me-1"></i>
                        <span sec:authentication="name">Tài khoản</span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow" aria-labelledby="userMenu">
                        <li><a class="dropdown-item" th:href="@{/profile}"><i class="bi bi-person me-2"></i>Hồ sơ cá nhân</a></li>
                        <li><a class="dropdown-item" th:href="@{/profile/addresses}"><i class="bi bi-geo-alt me-2"></i>Sổ địa chỉ</a></li>
                        <li><a class="dropdown-item" th:href="@{/orders/my-orders}"><i class="bi bi-bag-check me-2"></i>Đơn mua của tôi</a></li>
                        
                        <li sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'SALE_STAFF')"><hr class="dropdown-divider"></li>
                        <li sec:authorize="hasRole('ADMIN')"><a class="dropdown-item text-danger" th:href="@{/admin}"><i class="bi bi-shield-lock me-2"></i>Quản trị hệ thống</a></li>
                        <li sec:authorize="hasRole('MANAGER')"><a class="dropdown-item text-primary" th:href="@{/admin/products}"><i class="bi bi-box-seam me-2"></i>Quản lý kho & SP</a></li>
                        <li sec:authorize="hasRole('SALE_STAFF')"><a class="dropdown-item text-success" th:href="@{/staff/orders}"><i class="bi bi-card-checklist me-2"></i>Xử lý đơn hàng</a></li>
                        
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/auth/logout}" method="post">
                                <button type="submit" class="dropdown-item text-secondary"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>
</body>
</html>
