<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(title, content)" lang="vi" class="h-full">
    <head th:replace="~{fragments/head :: head(${title})}"></head>
    <body data-portal="shop"
        class="min-h-full flex flex-col bg-parchment text-carbon_black font-sans antialiased selection:bg-blazing_flame selection:text-white"
    >
        <!-- Storefront navigation -->
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <!-- Global Floating Toast Alerts Container -->
        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <!-- Dynamic Main Content Slot -->
        <main class="flex-1 w-full">
            <th:block th:replace="${content}" />
        </main>

        <!-- Storefront footer -->
        <div th:replace="~{fragments/footer :: footer}"></div>
        <script th:src="@{/js/password-visibility.js}" defer></script>
        <script th:src="@{/js/birthdate-input.js}" defer></script>
        <script th:src="@{/js/otp-countdown.js}" defer></script>
        <script th:src="@{/js/cart.js}" defer></script>
        <link rel="stylesheet" th:href="@{/css/form-validation.css}" />
        <script th:src="@{/js/form-validation.js}" defer></script>
        <link rel="stylesheet" th:href="@{/css/interaction.css}">
        <script th:src="@{/js/interaction.js}" defer></script>
    </body>
</html>
