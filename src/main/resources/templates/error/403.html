<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{${internalPage == true ? 'layout/internal' : 'layout/base'} :: layout('403 - Truy cập bị từ chối | AureliaBook', ~{::#main-content})}">
<head>
    <title>403 - Truy cập bị từ chối</title>
</head>
<body>
    <div id="main-content" class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-blazing_flame/10 text-blazing_flame shadow-sm mb-6">
                <i class="bi bi-shield-slash-fill text-4xl" aria-hidden="true"></i>
            </div>

            <div class="mb-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-blazing_flame/10 text-blazing_flame">
                    Mã lỗi 403
                </span>
            </div>
            <h1 class="font-serif text-3xl sm:text-4xl font-bold text-carbon_black mb-3">Truy cập bị từ chối</h1>

            <p class="text-sm text-carbon_black/70 mb-6 leading-relaxed">
                Tài khoản của bạn hiện chưa được cấp quyền truy cập vào khu vực hoặc chức năng này.
            </p>

            <div class="bg-white rounded-xl border border-dust_grey/50 shadow-sm p-4 mb-6 text-left space-y-3">
                <div class="flex items-center justify-between text-sm">
                    <span class="text-carbon_black/60 flex items-center gap-2">
                        <i class="bi bi-person-badge text-blazing_flame" aria-hidden="true"></i>Tài khoản hiện tại:
                    </span>
                    <strong class="font-semibold text-carbon_black text-xs sm:text-sm"
                            th:text="${username != null ? username : 'Khách vãng lai'}">nguoidung@example.com</strong>
                </div>
                <div class="flex items-center justify-between text-sm border-t border-dust_grey/20 pt-2.5">
                    <span class="text-carbon_black/60 flex items-center gap-2">
                        <i class="bi bi-shield-check text-emerald-600" aria-hidden="true"></i>Vai trò hiện tại:
                    </span>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-dust_grey/30 text-carbon_black"
                          th:text="${roles != null ? roles : 'Chưa xác thực'}">Khách hàng</span>
                </div>
            </div>

            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <a sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'SALE_STAFF')"
                   th:href="@{/dashboard}"
                   class="w-full sm:w-auto inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-medium bg-carbon_black text-white hover:bg-carbon_black/90 transition-colors shadow-sm">
                    <i class="bi bi-speedometer2 mr-2" aria-hidden="true"></i>Quay về bảng điều khiển
                </a>

                <a sec:authorize="!hasAnyRole('ADMIN','MANAGER','SALE_STAFF')"
                   th:href="@{${internalPage == true ? '/internal/login' : '/'}}"
                   class="w-full sm:w-auto inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-medium bg-blazing_flame text-white hover:bg-blazing_flame/90 transition-colors shadow-sm">
                    <i class="bi bi-house-door mr-2" aria-hidden="true"></i>
                    <span th:text="${internalPage == true ? 'Đăng nhập nội bộ' : 'Về trang chủ'}">Về trang chủ</span>
                </a>

                <form sec:authorize="isAuthenticated()"
                      th:action="@{${internalPage == true ? '/internal/logout' : '/auth/logout'}}"
                      method="post"
                      class="w-full sm:w-auto">
                    <button type="submit"
                            class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2.5 rounded-lg text-sm font-medium border border-dust_grey text-carbon_black hover:bg-alabaster_grey transition-colors">
                        <i class="bi bi-box-arrow-right mr-2" aria-hidden="true"></i>Đăng xuất / Đổi tài khoản
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
