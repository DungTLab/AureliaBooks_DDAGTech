<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('403 - Quyền Bị Từ Chối | AureliaBook', ~{::#main-content})}">
<head>
    <title>403 - Quyền Bị Từ Chối</title>
</head>
<body>
    <div id="main-content" class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full text-center">
            <!-- Error Icon Badge -->
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-blazing_flame/10 text-blazing_flame shadow-sm mb-6">
                <i class="bi bi-shield-slash-fill text-4xl"></i>
            </div>

            <!-- Error Title & Status -->
            <h1 class="text-4xl font-extrabold text-carbon_black tracking-tight mb-2">403 Forbidden</h1>
            <h2 class="text-xl font-bold text-blazing_flame mb-3">Truy Cập Bị Từ Chối</h2>

            <!-- Descriptive Text -->
            <p class="text-sm text-carbon_black/70 mb-6 leading-relaxed">
                Tài khoản của bạn không có đủ đặc quyền vai trò (Role-Based Access Control) để truy cập vào phân vùng quản trị hoặc thực hiện tác vụ này.
            </p>

            <!-- User Security Context Card -->
            <div class="bg-white rounded-xl border border-dust_grey/50 shadow-sm p-4 mb-6 text-left space-y-3">
                <div class="flex items-center justify-between text-sm">
                    <span class="text-carbon_black/60 flex items-center gap-2">
                        <i class="bi bi-person-badge text-blazing_flame"></i>Tài khoản hiện tại:
                    </span>
                    <strong class="font-semibold text-carbon_black text-xs sm:text-sm" th:text="${username != null ? username : 'Anonymous'}">nguoidung@example.com</strong>
                </div>
                <div class="flex items-center justify-between text-sm border-t border-dust_grey/20 pt-2.5">
                    <span class="text-carbon_black/60 flex items-center gap-2">
                        <i class="bi bi-shield-check text-emerald-600"></i>Vai trò được cấp:
                    </span>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-dust_grey/30 text-carbon_black" th:text="${roles != null ? roles : 'ROLE_ANONYMOUS'}">ROLE_CUSTOMER</span>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-3">
                <!-- Staff/Admin Shortcut -->
                <a sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'SALE_STAFF')"
                   th:href="@{/dashboard}"
                   class="w-full sm:w-auto inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-medium bg-carbon_black text-white hover:bg-carbon_black/90 transition-colors shadow-sm">
                    <i class="bi bi-speedometer2 mr-2"></i>Bảng Điều Khiển
                </a>

                <!-- Storefront Home Shortcut -->
                <a th:href="@{/}"
                   class="w-full sm:w-auto inline-flex items-center justify-center px-5 py-2.5 rounded-lg text-sm font-medium bg-blazing_flame text-white hover:bg-blazing_flame/90 transition-colors shadow-sm">
                    <i class="bi bi-house-door mr-2"></i>Về Trang Chủ
                </a>

                <!-- Logout / Switch Account Form -->
                <form th:action="@{/auth/logout}" method="post" class="w-full sm:w-auto">
                    <button type="submit"
                            class="w-full sm:w-auto inline-flex items-center justify-center px-4 py-2.5 rounded-lg text-sm font-medium border border-dust_grey text-carbon_black hover:bg-alabaster_grey transition-colors">
                        <i class="bi bi-box-arrow-right mr-2"></i>Đổi Tài Khoản
                    </button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
