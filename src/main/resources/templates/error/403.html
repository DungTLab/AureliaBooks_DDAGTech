<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: layout('403 - Quyền Bị Từ Chối | AureliaBook', ~{::#main-content})}">
<head>
    <title>403 - Quyền Bị Từ Chối</title>
</head>
<body>
    <div id="main-content" class="container py-5 my-auto">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6 text-center">
                <!-- Error Icon -->
                <div class="mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-10 text-danger rounded-circle shadow-sm" style="width: 100px; height: 100px;">
                        <i class="bi bi-shield-slash-fill" style="font-size: 3rem;"></i>
                    </div>
                </div>

                <!-- Error Title & Status -->
                <h1 class="display-5 fw-bold text-navy mb-2">403 Forbidden</h1>
                <h3 class="h5 fw-semibold text-danger mb-3">Truy Cập Bị Từ Chối</h3>

                <!-- Descriptive Information -->
                <p class="text-muted mb-4">
                    Tài khoản của bạn không có đủ đặc quyền vai trò (Role-Based Access Control) để truy cập vào phân vùng hoặc thực hiện tác vụ này.
                </p>

                <!-- User Context Details Card -->
                <div class="card border-0 bg-white shadow-sm rounded-3 mb-4 text-start p-3">
                    <div class="d-flex align-items-center mb-2">
                        <i class="bi bi-person-badge text-primary me-2 fs-5"></i>
                        <span class="text-muted small">Tài khoản hiện tại:</span>
                        <strong class="ms-auto text-dark" th:text="${username}">nguoidung@example.com</strong>
                    </div>
                    <div class="d-flex align-items-center">
                        <i class="bi bi-shield-check text-warning me-2 fs-5"></i>
                        <span class="text-muted small">Vai trò được cấp:</span>
                        <span class="ms-auto badge bg-secondary" th:text="${roles}">ROLE_CUSTOMER</span>
                    </div>
                </div>

                <!-- Navigation Actions -->
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                    <!-- Staff/Admin Redirect -->
                    <a sec:authorize="hasAnyRole('ADMIN', 'MANAGER', 'SALE_STAFF')"
                       th:href="@{/dashboard}" class="btn btn-navy px-4 py-2 text-white">
                        <i class="bi bi-speedometer2 me-2"></i>Về Bảng Điều Khiển
                    </a>

                    <!-- Customer / Guest Redirect -->
                    <a th:href="@{/}" class="btn btn-warning px-4 py-2 fw-semibold text-dark">
                        <i class="bi bi-house-door me-2"></i>Về Trang Chủ Mua Sắm
                    </a>

                    <!-- Logout Option for Switching Account -->
                    <form th:action="@{/auth/logout}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-outline-secondary px-4 py-2 w-100">
                            <i class="bi bi-box-arrow-right me-2"></i>Đổi Tài Khoản
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
