<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{${internalPage == true ? 'layout/internal' : 'layout/base'} :: layout('404 - Không Tìm Thấy Trang | AureliaBook', ~{::#main-content})}">
<head>
    <title>404 - Không Tìm Thấy Trang</title>
</head>
<body>
    <div id="main-content" class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="max-w-md w-full text-center">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-amber-500/10 text-amber-600 shadow-sm mb-6">
                <i class="bi bi-compass text-4xl" aria-hidden="true"></i>
            </div>

            <div class="mb-3">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-semibold uppercase tracking-wider bg-amber-500/10 text-amber-700">
                    Mã lỗi 404
                </span>
            </div>
            <h1 class="font-serif text-3xl sm:text-4xl font-bold text-carbon_black mb-3">Trang yêu cầu không tồn tại</h1>

            <p class="text-sm text-carbon_black/70 mb-6 leading-relaxed">
                Liên kết bạn vừa truy cập có thể đã bị di chuyển, đổi tên hoặc không còn tồn tại trên hệ thống AureliaBook.
            </p>

            <form th:unless="${internalPage == true}"
                  class="flex items-center max-w-sm mx-auto mb-6"
                  th:action="@{/products/search}"
                  method="get">
                <div class="relative w-full">
                    <input type="search" name="keyword"
                           class="w-full px-4 py-2.5 pl-10 rounded-lg text-sm border border-dust_grey bg-white text-carbon_black placeholder-carbon_black/40 focus:outline-none focus:ring-2 focus:ring-blazing_flame focus:border-transparent transition-all"
                           placeholder="Tìm kiếm sách hoặc văn phòng phẩm..." />
                    <i class="bi bi-search absolute left-3.5 top-3 text-carbon_black/40 text-sm" aria-hidden="true"></i>
                </div>
                <button type="submit"
                        class="ml-2 inline-flex items-center px-4 py-2.5 rounded-lg text-sm font-medium bg-blazing_flame text-white hover:bg-blazing_flame/90 transition-colors shadow-sm">
                    Tìm
                </button>
            </form>

            <div>
                <a th:href="@{${internalPage == true ? '/dashboard' : '/'}}"
                   class="inline-flex items-center px-5 py-2.5 rounded-lg text-sm font-medium bg-carbon_black text-white hover:bg-carbon_black/90 transition-colors shadow-sm">
                    <i class="bi mr-2"
                       th:classappend="${internalPage == true} ? ' bi-speedometer2' : ' bi-house-door'"
                       aria-hidden="true"></i>
                    <span th:text="${internalPage == true ? 'Quay về bảng điều khiển' : 'Về trang chủ'}">Về trang chủ</span>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
