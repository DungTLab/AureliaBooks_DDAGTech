<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<div th:fragment="field" class="md:col-span-2" data-product-image-field>
    <label class="block text-xs font-bold mb-1.5" for="mainImageUrl">Đường dẫn ảnh sản phẩm</label>
    <input id="mainImageUrl" type="text" th:field="*{mainImageUrl}" maxlength="500"
           placeholder="https://example.com/cover.jpg hoặc /products/images/…"
           class="w-full px-3.5 py-2.5 text-sm bg-white border border-dust_grey rounded-xl">
    <p class="text-xs mt-1">Bạn có thể giữ URL ảnh hiện tại hoặc nhập URL HTTP/HTTPS khác.</p>
    <div th:if="${productImageUploadEnabled}" class="mt-3 space-y-2" data-image-uploader
         th:data-upload-url="@{/manager/products/images}">
        <label for="productImageFile" class="block text-sm">Tải ảnh từ máy (PNG/JPEG, tối đa 5 MiB)</label>
        <input id="productImageFile" data-image-file type="file" accept="image/png,image/jpeg">
        <input type="hidden" data-image-csrf th:data-header="${_csrf.headerName}" th:value="${_csrf.token}">
        <button type="button" data-image-upload class="px-3 py-2 border rounded-xl">Tải ảnh lên</button>
        <p data-image-status role="status" aria-live="polite" class="text-sm"></p>
        <img data-image-preview hidden alt="Xem trước ảnh vừa chọn" class="max-h-48 max-w-full rounded-xl">
        <p class="text-xs">Sau khi tải ảnh, hãy lưu sản phẩm để ảnh được hiển thị. Ảnh cũ được giữ nếu tải lên thất bại.</p>
    </div>
</div>
</body></html>
