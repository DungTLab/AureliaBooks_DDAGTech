<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/internal :: layout('Quên mật khẩu nội bộ', ~{::#main-content})}">
<body>
<section id="main-content" class="workspace-login-card">
    <h1 class="font-serif text-3xl font-bold mb-5">Quên mật khẩu nội bộ</h1>

    <p th:unless="${recoveryEnabled}" class="mb-5">Tính năng tự khôi phục đang tạm đóng. Vui lòng liên hệ Quản trị viên để được hỗ trợ.</p>
    <th:block th:if="${recoveryEnabled}">
        <p th:if="${recoveryMessage}" th:text="${recoveryMessage}" role="status" class="bg-parchment rounded-xl p-3 mb-5"></p>
        <form th:unless="${showCode}" th:action="@{/internal/forgot-password/send}" method="post" class="space-y-4">
            <label for="recoveryEmail" class="block font-semibold">Email công việc</label>
            <input id="recoveryEmail" name="email" type="email" required maxlength="100" autocomplete="email"
                   class="w-full border border-dust_grey rounded-xl p-3">
            <button type="submit" class="bg-blazing_flame text-white px-5 py-3 rounded-xl">Gửi mã xác thực</button>
        </form>

        <div th:if="${showCode and !authorized}" class="space-y-4">
            <p>Mã có hiệu lực trong 5 phút. Bạn có thể gửi lại sau 60 giây.</p>
            <form th:action="@{/internal/forgot-password/verify}" method="post" class="space-y-4">
                <label for="recoveryCode" class="block font-semibold">Mã xác thực 6 chữ số</label>
                <input id="recoveryCode" name="code" type="text" inputmode="numeric" autocomplete="one-time-code"
                       required pattern="[0-9]{6}" maxlength="6" class="w-full border border-dust_grey rounded-xl p-3">
                <button type="submit" class="bg-blazing_flame text-white px-5 py-3 rounded-xl">Xác nhận</button>
            </form>
            <form th:action="@{/internal/forgot-password/resend}" method="post">
                <button type="submit" class="border border-dust_grey rounded-xl px-4 py-2">Gửi lại mã</button>
            </form>
            <a th:href="@{/internal/forgot-password}" class="underline">Dùng email khác</a>
        </div>

        <form th:if="${authorized}" th:action="@{/internal/forgot-password/reset}" method="post"
              data-valid-form data-password-change class="space-y-4">
            <p>Từ 8 ký tự, có chữ hoa, số và ký tự đặc biệt.</p>
            <label for="recoveryPassword" class="block font-semibold">Mật khẩu mới</label>
            <input id="recoveryPassword" name="password" type="password" required minlength="8" autocomplete="new-password"
                   class="w-full border border-dust_grey rounded-xl p-3">
            <label for="recoveryConfirmation" class="block font-semibold">Xác nhận mật khẩu mới</label>
            <input id="recoveryConfirmation" name="confirmation" type="password" required autocomplete="new-password"
                   class="w-full border border-dust_grey rounded-xl p-3">
            <p data-form-feedback aria-live="polite" class="text-sm text-carbon_black-500"></p>
            <button type="submit" class="bg-blazing_flame text-white px-5 py-3 rounded-xl disabled:opacity-40">
                Đặt mật khẩu mới
            </button>
        </form>
    </th:block>

    <a th:href="@{/internal/login}" class="inline-block mt-5 underline">Quay về đăng nhập nội bộ</a>
</section>
</body>
</html>
