server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: AureliaBooks
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  # Database Connection Configuration (MySQL 8.0 utf8mb4)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:aurelia_books_db}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: AureliaBooksHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  # JPA & Hibernate Configuration
  jpa:
    hibernate:
      ddl-auto: update # schema.sql (21 tables) is authoritative; do not alter tables from scaffold
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

  # Thymeleaf Template Engine Configuration
  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  # Multipart / File Upload Limits (Cover Images & Avatars)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

logging:
  level:
    com.ddagtech.aureliabooks: INFO
    org.springframework.security: INFO

app:
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    phone: ${BOOTSTRAP_ADMIN_PHONE:}
  contact-verification:
    mail-from: ${MAIL_FROM:no-reply@aureliabook.local}
    twilio-account-sid: ${TWILIO_ACCOUNT_SID:}
    twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
    twilio-from: ${TWILIO_FROM:}
  avatar:
    directory: ${AVATAR_DIRECTORY:./uploads/avatars}
  r2:
    enabled: ${R2_ENABLED:false}
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key-id: ${R2_ACCESS_KEY_ID:}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:}
  cron:
    vnpay-timeout-ms: ${APP_CRON_VNPAY_TIMEOUT_MS:60000}
    vector-preload: ${APP_CRON_VECTOR_PRELOAD:0 0 2 * * ?}
    session-cleanup: ${APP_CRON_SESSION_CLEANUP:0 */30 * * * ?}

# VNPay Sandbox Configuration (UC11.1 / FND-04)
# Credentials must be supplied via environment variables; gateway fails closed when omitted.
vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  return-url: ${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay-return}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  version: ${VNPAY_VERSION:2.1.0}
  command: ${VNPAY_COMMAND:pay}
  order-type: ${VNPAY_ORDER_TYPE:other}
  expire-minutes: ${VNPAY_EXPIRE_MINUTES:15}
